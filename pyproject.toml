[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jc-github-action-security-auditor"
version = "0.1.0"
description = "An offline GitHub Actions workflow security auditor"
authors = [{ name = "Jacivaldo Carvalho", email = "jacivaldocarvalho@gmail.com" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0.2,<7"]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov>=7", "ruff"]

[project.scripts]
jc-gha-audit = "jc_github_action_security_auditor.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/jc_github_action_security_auditor"]

[tool.ruff]
target-version = "py311"

[tool.coverage.run]
source = ["src/jc_github_action_security_auditor"]
omit = ["*/tests/*", "*/__pycache__/*"]
patch = ["subprocess"]
